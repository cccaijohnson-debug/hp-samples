<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ホームページサンプル集</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700&display=swap" rel="stylesheet">
<style>
*, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
:root {
  --text: #1a1a1a; --text-muted: #666; --text-light: #999;
  --border: rgba(0,0,0,0.1); --bg: #f5f4f0; --bg-card: #fff;
  --accent: #185FA5; --accent-light: #E6F1FB;
  --radius: 12px; --radius-sm: 8px;
}
body { font-family: 'Noto Sans JP', sans-serif; color: var(--text); background: var(--bg); line-height: 1.7; min-height: 100vh; }

header {
  background: #fff; border-bottom: 0.5px solid var(--border);
  padding: 0 max(1.5rem, calc(50% - 600px));
}
.header-inner { display: flex; align-items: center; justify-content: space-between; height: 60px; }
.site-title { font-size: 15px; font-weight: 700; color: var(--text); }
.site-title span { color: var(--accent); }
.header-count { font-size: 12px; color: var(--text-muted); }

main { padding: 40px max(1.5rem, calc(50% - 600px)) 80px; }

.toolbar {
  display: flex; align-items: center; gap: 12px;
  margin-bottom: 28px; flex-wrap: wrap;
}
.filter-label { font-size: 12px; color: var(--text-muted); }
.filter-btn {
  font-size: 12px; padding: 6px 14px;
  border: 0.5px solid var(--border); border-radius: 20px;
  background: #fff; cursor: pointer; transition: all 0.15s;
  font-family: inherit; color: var(--text-muted);
}
.filter-btn:hover { border-color: var(--accent); color: var(--accent); }
.filter-btn.active { background: var(--accent); color: #fff; border-color: var(--accent); }

.grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
  gap: 20px;
}

.card {
  background: var(--bg-card); border: 0.5px solid var(--border);
  border-radius: var(--radius); overflow: hidden;
  transition: box-shadow 0.2s, transform 0.2s;
  text-decoration: none; color: inherit; display: block;
}
.card:hover { box-shadow: 0 8px 28px rgba(0,0,0,0.08); transform: translateY(-2px); }

.card-thumb {
  height: 160px; display: flex; align-items: center; justify-content: center;
  font-size: 36px; position: relative; overflow: hidden;
}
.card-thumb::after {
  content: ''; position: absolute; inset: 0;
  background: linear-gradient(to bottom, transparent 60%, rgba(0,0,0,0.1));
}

.card-body { padding: 1rem 1.25rem 1.25rem; }
.card-tag {
  display: inline-block; font-size: 11px;
  background: var(--accent-light); color: var(--accent);
  padding: 3px 10px; border-radius: 20px; margin-bottom: 8px;
}
.card-title { font-size: 15px; font-weight: 700; margin-bottom: 4px; }
.card-desc { font-size: 12px; color: var(--text-muted); line-height: 1.6; }
.card-footer {
  display: flex; align-items: center; justify-content: space-between;
  margin-top: 12px; padding-top: 12px;
  border-top: 0.5px solid var(--border);
}
.card-date { font-size: 11px; color: var(--text-light); }
.card-link {
  font-size: 12px; color: var(--accent); font-weight: 500;
  display: flex; align-items: center; gap: 4px;
}

.empty { text-align: center; padding: 60px 0; color: var(--text-muted); font-size: 14px; display: none; }

@media (max-width: 600px) {
  .grid { grid-template-columns: 1fr; }
}
</style>
</head>
<body>

<header>
  <div class="header-inner">
    <div class="site-title">HP<span>サンプル</span>集</div>
    <div class="header-count" id="count">1件</div>
  </div>
</header>

<main>
  <div class="toolbar">
    <span class="filter-label">業種：</span>
    <button class="filter-btn active" data-filter="all">すべて</button>
    <button class="filter-btn" data-filter="士業">士業</button>
    <button class="filter-btn" data-filter="飲食">飲食</button>
    <button class="filter-btn" data-filter="美容">美容</button>
    <button class="filter-btn" data-filter="建設">建設</button>
    <button class="filter-btn" data-filter="医療">医療</button>
    <button class="filter-btn" data-filter="その他">その他</button>
  </div>

  <div class="grid" id="grid">
<a class="card" href="manual.html" data-category="その他">
  <div class="card-thumb" style="background: #185FA5;">
    <span style="font-size:40px;">📖</span>
  </div>
  <div class="card-body">
    <div class="card-tag">その他</div>
    <div class="card-title">HPサンプル追加マニュアル</div>
    <div class="card-desc">自分のサイトをギャラリーに追加する手順をまとめたガイドです。</div>
    <div class="card-footer">
      <span class="card-date">2025-05-21</span>
      <span class="card-link">開く →</span>
    </div>
  </div>
</a>
    <!-- ▼ サンプルをここに追加していく ▼ -->

    <a class="card" href="yamada-tax-office.html" data-category="士業">
      <div class="card-thumb" style="background: #042C53;">
        <span style="font-size:40px;">📊</span>
      </div>
      <div class="card-body">
        <div class="card-tag">士業</div>
        <div class="card-title">山田税理士事務所</div>
        <div class="card-desc">中小企業・個人事業主向け。料金表・代表プロフィール・FAQ付きの本格的な士業サイト。</div>
        <div class="card-footer">
          <span class="card-date">2025-05-20</span>
          <span class="card-link">開く →</span>
        </div>
      </div>
    </a>
<a class="card" href="kurahachi.html" data-category="飲食">
  <div class="card-thumb" style="background: #1A0A00;">
    <span style="font-size:40px;">🍢</span>
  </div>
  <div class="card-body">
    <div class="card-tag">飲食</div>

    </div>
  </div>
</a>

    <a class="card" href="restaurant/sample.html" data-category="飲食">
      <div class="card-thumb" style="background: #3D1A00;">
        <span>🍜</span>
      </div>
      <div class="card-body">
        <div class="card-tag">飲食</div>
        <div class="card-title">○○レストラン</div>

        <div class="card-footer">
          <span class="card-date">2025-XX-XX</span>
          <span class="card-link">開く →</span>
        </div>
      </div>
    </a>
    -->

  </div>
  <div class="empty" id="empty">該当するサンプルがありません</div>
</main>

<script>
  const cards = document.querySelectorAll('.card');
  const btns = document.querySelectorAll('.filter-btn');
  const countEl = document.getElementById('count');
  const emptyEl = document.getElementById('empty');

  function updateCount() {
    const visible = [...cards].filter(c => c.style.display !== 'none').length;
    countEl.textContent = visible + '件';
    emptyEl.style.display = visible === 0 ? 'block' : 'none';
  }

  btns.forEach(btn => {
    btn.addEventListener('click', () => {
      btns.forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      const f = btn.dataset.filter;
      cards.forEach(card => {
        card.style.display = (f === 'all' || card.dataset.category === f) ? 'block' : 'none';
      });
      updateCount();
    });
  });

  updateCount();
</script>
</body>
</html>
